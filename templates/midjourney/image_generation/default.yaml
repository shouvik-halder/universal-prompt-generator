  {{ SUBJECT | default('[MAIN SUBJECT]') }}{% if STYLE %}, {{ STYLE }} style{% endif %}{% if MOOD %}, {{ MOOD }} atmosphere{% endif %}{% if LIGHTING %}, {{ LIGHTING }} lighting{% endif %}{% if COMPOSITION %}, {{ COMPOSITION }}{% endif %}, high quality, highly detailed, professional --ar {{ ASPECT_RATIO | default('16:9') }} --v {{ VERSION | default('6.0') }}{% if STYLIZE %} --stylize {{ STYLIZE }}{% endif %}

